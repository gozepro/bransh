<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="description" content="Bransh : l'information au plus près de vous, vérifiée ensemble." />
    <title>Bransh</title>
    <script>
      // Applique le thème (clair, sombre ou automatique) avant l'affichage pour éviter un flash
      ;(function () {
        var theme = 'light'
        try {
          var pref = localStorage.getItem('bransh-theme')
          if (pref === 'light' || pref === 'dark') theme = pref
          else theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0d0e12' : '#faf7f2')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
