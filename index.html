    <!-- Aperçu quand on partage le lien (WhatsApp, Facebook, X…).
         À mettre à jour si le nom de domaine change : remplace l'adresse ci-dessous. -->

    <meta property="og:site_name" content="Bransh" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Bransh : l'information au plus près de vous" />
    <meta property="og:description" content="Signale ce que tu vois, vérifie avec ton quartier. Gratuit et open source." />
    <meta property="og:url" content="https://bransh-zeta.vercel.app/" />
    <meta property="og:image" content="https://bransh-zeta.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bransh : l'information au plus près de vous" />
    <meta name="twitter:description" content="Signale ce que tu vois, vérifie avec ton quartier. Gratuit et open source." />
    <meta name="twitter:image" content="https://bransh-zeta.vercel.app/og-image.jpg" />
    <title>Bransh</title>
    <script>
      // Applique le thème (clair, sombre ou automatique) avant l'affichage pour éviter un flash
      ;(function () {
        var theme = 'light'
        try {
          var pref = localStorage.getItem('bransh-theme')
          if (pref === 'light' || pref === 'dark') theme = pref
          else theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0d0e12' : '#faf7f2')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
